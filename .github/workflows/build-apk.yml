name: Build Masroofi APK v1.4

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android files
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

          mkdir -p android/app/src/main/java/com/masroofi/app

          if [ -f android/app/src/main/MainActivity.java ]; then
            cp android/app/src/main/MainActivity.java \
              android/app/src/main/java/com/masroofi/app/MainActivity.java
          fi

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroofi-APK-v1.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
